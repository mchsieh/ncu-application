  var STORE = "ncu-application-key", DAYS = 30;
  function b64(s) { var bin = atob(s), out = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
  function toB64(buf) { var bin = "", u = new Uint8Array(buf); for (var i = 0; i < u.length; i++) bin += String.fromCharCode(u[i]); return btoa(bin); }
  var gate = document.getElementById("gate"), form = document.getElementById("form"), msg = document.getElementById("msg");

  function deriveKey(pass) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pass.normalize("NFC")), "PBKDF2", false, ["deriveBits"])
      .then(function (base) { return crypto.subtle.deriveBits({ name: "PBKDF2", salt: b64(SALT), iterations: ROUNDS, hash: "SHA-256" }, base, 256); });

  function decrypt(rawKey) {

  function remember(rawKey, keep) {

    try { sessionStorage.setItem(STORE, value); } catch (e) {}
    try { if (keep) localStorage.setItem(STORE, JSON.stringify({ key: value, until: Date.now() + DAYS * 864e5 })); } catch (e) {}

  function remembered() {
    try { var s = sessionStorage.getItem(STORE); if (s) return s; } catch (e) {}

    return null;
  }
  function forget() { try { sessionStorage.removeItem(STORE); localStorage.removeItem(STORE); } catch (e) {} }
  // replace this page by the decrypted one, at the same address, so that its own links and files work as usual
  // (only once this page has finished loading: while it is still being parsed, document.write would append to it)
  function open(html) {
    if (document.readyState !== "complete") { window.addEventListener("load", function () { open(html); }, { once: true }); return; }
    var target = location.hash && !/^#key=/.test(location.hash) ? decodeURIComponent(location.hash.slice(1)) : "";

    if (target) setTimeout(function () { var el = document.getElementById(target); if (el) el.scrollIntoView(); }, 400);

  function ask(note) { gate.hidden = false; msg.textContent = note || ""; document.getElementById("pass").focus(); }

  if (!window.crypto || !crypto.subtle) { gate.hidden = false; form.innerHTML = "<h1>This browser cannot open the page</h1><p>Please use a current version of Chrome, Edge, Firefox or Safari. The same content is in the PDF.</p>"; return; }

  var fromLink = /^#key=(.+)$/.exec(location.hash || "");
  if (fromLink) {
    var pass = decodeURIComponent(fromLink[1]);
