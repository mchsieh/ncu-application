  var STORE = "ncu-application-key", DAYS = 30;

  function deriveKey(pass) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pass.normalize("NFC")), "PBKDF2", false, ["deriveBits"])

  function open(html) {
